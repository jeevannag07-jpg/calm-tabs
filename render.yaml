services:
  # Backend API (Python FastAPI + Shapely)
  - type: web
    name: jurisshift-backend
    env: python
    region: singapore
    rootDir: jurisshift/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend Web App (React + Vite + Leaflet)
  - type: web
    name: jurisshift-frontend
    env: static
    region: singapore
    rootDir: jurisshift/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jurisshift-backend
          property: host
        propertyFilter:
          prepend: https://
          append: /api
